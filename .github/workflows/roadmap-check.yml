name: roadmap-check
on: [push, pull_request]
jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify roadmap structure
        run: |
          test -f README.md
          test -f PROJECTS.md
          test -f checklists/progress.md
          test -f interview/README.md
          test "$(find projects -name '*.md' | wc -l)" -eq 50
